<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChemCalc - Kalkulator Kimia</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f0f5fb;
  color: #172b4d;
}

header {
  background: linear-gradient(135deg, #123c69, #087e8b);
  color: white;
  padding: 28px 18px;
  text-align: center;
}

header h1 {
  margin: 0 0 8px;
  font-size: 30px;
}

header p {
  margin: 0;
  opacity: 0.9;
}

.container {
  width: min(900px, 92%);
  margin: 25px auto;
}

.card {
  background: white;
  padding: 22px;
  margin-bottom: 20px;
  border-radius: 16px;
  box-shadow: 0 5px 18px #18315312;
}

h2 {
  margin-top: 0;
  color: #087e8b;
}

label {
  display: block;
  margin: 14px 0 7px;
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccd6e0;
  border-radius: 8px;
  font-size: 16px;
  background: white;
}

button {
  width: 100%;
  margin-top: 16px;
  padding: 13px;
  border: 0;
  border-radius: 8px;
  background: #087e8b;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #066570;
}

.result {
  display: none;
  margin-top: 16px;
  padding: 15px;
  background: #e5f7f4;
  border-radius: 9px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.error {
  background: #fff0f0;
  color: #a52222;
}

footer {
  text-align: center;
  padding: 20px;
  color: #667085;
  font-size: 13px;
}
</style>
</head>

<body>
<header>
  <h1>⚗️ ChemCalc</h1>
  <p>Kalkulator Kimia Digital untuk Belajar Lebih Mudah</p>
</header>

<main class="container">

  <section class="card">
    <h2>1. Massa Molar</h2>
    <p>Masukkan rumus kimia senyawa.</p>

    <label for="formula">Rumus kimia</label>
    <input id="formula" placeholder="Contoh: H2O, CO2, Ca(OH)2">

    <button onclick="calculateMolar()">
      Hitung Massa Molar
    </button>

    <div id="molarResult" class="result"
         aria-live="polite"></div>
  </section>

  <section class="card">
    <h2>2. Kalkulator Jumlah Mol</h2>
    <p>Rumus: n = m / Mr</p>

    <label for="mass">Massa zat (gram)</label>
    <input id="mass" type="number" min="0"
           step="any" placeholder="Contoh: 18">

    <label for="mr">Massa molar (g/mol)</label>
    <input id="mr" type="number" min="0"
           step="any" placeholder="Contoh: 18.015">

    <button onclick="calculateMoles()">Hitung Mol</button>

    <div id="molResult" class="result"
         aria-live="polite"></div>
  </section>

  <section class="card">
    <h2>3. Kalkulator pH</h2>
    <p>Untuk larutan asam kuat atau basa kuat
       dengan asumsi disosiasi sempurna.</p>

    <label for="kind">Jenis larutan</label>
    <select id="kind">
      <option value="acid">Asam kuat (contoh: HCl)</option>
      <option value="base">Basa kuat (contoh: NaOH)</option>
    </select>

    <label for="concentration">Konsentrasi (mol/L)</label>
    <input id="concentration" type="number"
           min="0" step="any" placeholder="Contoh: 0.01">

    <button onclick="calculatePH()">Hitung pH</button>

    <div id="phResult" class="result"
         aria-live="polite"></div>
  </section>

</main>

<footer>
  ChemCalc © 2026 | Media belajar kimia
</footer>

<script>
// Massa atom relatif (g/mol), dibulatkan
const atomicMass = {
  H: 1.008, He: 4.0026, Li: 6.94, Be: 9.0122,
  B: 10.81, C: 12.011, N: 14.007, O: 15.999,
  F: 18.998, Ne: 20.180, Na: 22.990, Mg: 24.305,
  Al: 26.982, Si: 28.085, P: 30.974, S: 32.06,
  Cl: 35.45, Ar: 39.948, K: 39.098, Ca: 40.078,
  Cr: 51.996, Mn: 54.938, Fe: 55.845, Co: 58.933,
  Ni: 58.693, Cu: 63.546, Zn: 65.38, Br: 79.904,
  Ag: 107.868, I: 126.904, Ba: 137.327,
  Au: 196.967, Hg: 200.592, Pb: 207.2
};

const subscripts = {
  "₀": "0", "₁": "1", "₂": "2", "₃": "3",
  "₄": "4", "₅": "5", "₆": "6", "₇": "7",
  "₈": "8", "₉": "9"
};

function showResult(id, html, isError = false) {
  const box = document.getElementById(id);
  box.style.display = "block";
  box.className = isError ? "result error" : "result";
  box.innerHTML = html;
}

// Menghitung massa molar, termasuk tanda kurung.
function molarMass(formula) {
  formula = formula.replace(/[₀-₉]/g,
    digit => subscripts[digit]);

  if (!formula || formula.length > 100) {
    throw new Error("Rumus kimia kosong atau terlalu panjang.");
  }

  let pos = 0;

  function parseGroup(nested = false) {
    let total = 0;
    let found = false;

    while (pos < formula.length) {
      const char = formula[pos];

      if (char === ")") {
        if (!nested) {
          throw new Error("Tanda kurung tidak sesuai.");
        }
        pos++;
        return { total, found };
      }

      if (char === "(") {
        pos++;
        const group = parseGroup(true);

        if (!group.found) {
          throw new Error("Isi tanda kurung tidak valid.");
        }

        const count = readCount();
        total += group.total * count;
        found = true;
        continue;
      }

      const match = formula.slice(pos).match(/^[A-Z][a-z]?/);

      if (!match) {
        throw new Error("Format rumus kimia tidak valid.");
      }

      const element = match[0];

      if (!(element in atomicMass)) {
        throw new Error("Unsur " + element +
          " belum tersedia di database.");
      }

      pos += element.length;
      const count = readCount();

      total += atomicMass[element] * count;
      found = true;
    }

    if (nested) {
      throw new Error("Tanda kurung belum ditutup.");
    }

    return { total, found };
  }

  function readCount() {
    const match = formula.slice(pos).match(/^\d+/);

    if (!match) return 1;

    pos += match[0].length;
    const count = Number(match[0]);

    if (!Number.isSafeInteger(count) || count < 1 ||
        count > 10000) {
      throw new Error("Jumlah atom tidak valid.");
    }

    return count;
  }

  const result = parseGroup();

  if (!result.found || pos !== formula.length ||
      !Number.isFinite(result.total)) {
    throw new Error("Rumus kimia tidak dapat dihitung.");
  }

  return result.total;
}

function calculateMolar() {
  try {
    const formula = document.getElementById("formula").value
      .trim();

    const mr = molarMass(formula);

    showResult("molarResult",
      "<strong>Hasil perhitungan</strong><br>" +
      "Rumus: " + formula.replace(/&/g, "&amp;")
        .replace(/</g, "&lt;").replace(/>/g, "&gt;") +
      "<br>Massa molar: <strong>" +
      mr.toFixed(3) + " g/mol</strong>");
  } catch (error) {
    showResult("molarResult", error.message, true);
  }
}

function calculateMoles() {
  const mass = Number(document.getElementById("mass").value);
  const mr = Number(document.getElementById("mr").value);

  if (document.getElementById("mass").value === "" ||
      document.getElementById("mr").value === "" ||
      !Number.isFinite(mass) || !Number.isFinite(mr) ||
      mass < 0 || mr <= 0) {
    showResult("molResult",
      "Masukkan massa ≥ 0 dan massa molar > 0 yang valid.",
      true);
    return;
  }

  const n = mass / mr;

  showResult("molResult",
    "Rumus: n = m / Mr<br>" +
    "n = " + mass + " / " + mr +
    "<br>Jumlah mol: <strong>" + n.toPrecision(6) +
    " mol</strong>");
}

function calculatePH() {
  const input = document.getElementById("concentration");
  const concentration = Number(input.value);
  const kind = document.getElementById("kind").value;

  if (input.value.trim() === "" ||
      !Number.isFinite(concentration) ||
      concentration <= 0) {
    showResult("phResult",
      "Konsentrasi harus lebih besar dari 0.",
      true);
    return;
  }

  // Model sederhana pada suhu sekitar 25°C.
  let ph;

  if (kind === "acid") {
    ph = -Math.log10(concentration);
  } else {
    const pOH = -Math.log10(concentration);
    ph = 14 - pOH;
  }

  const note = concentration > 1
    ? "<br><small>Perhitungan memakai pendekatan konsentrasi ideal.</small>"
    : "";

  showResult("phResult",
    "Jenis: " + (kind === "acid" ? "Asam kuat" : "Basa kuat") +
    "<br>Konsentrasi: " + concentration + " mol/L" +
    "<br>pH perkiraan: <strong>" + ph.toFixed(3) +
    "</strong>" + note);
}
</script>
</body>
</html>
